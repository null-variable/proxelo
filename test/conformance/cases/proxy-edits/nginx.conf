upstream backend {
    server 127.0.0.1:18481;
}
server {
    listen 127.0.0.1:18480;
    server_name example.com;
    root /srv/www;
    location /plain/ {
        proxy_pass http://backend;
    }
    location /uri/ {
        proxy_pass http://backend/inner/;
    }
    location /rules/ {
        proxy_pass http://backend;
        proxy_redirect default;
        proxy_redirect ~*^http://([a-z]+)\.internal/(.*)$ https://$1.example.com/$2;
        proxy_cookie_domain ~\.internal$ example.com;
        proxy_cookie_domain up.local .example.com;
        proxy_cookie_path ~*^/APP/(.*)$ /$1;
        proxy_cookie_flags sid nosecure httponly samesite=lax;
        proxy_cookie_flags ~ secure;
    }
    location /off/ {
        proxy_redirect off;
        proxy_pass http://backend;
    }
    location /intercept/ {
        proxy_intercept_errors on;
        error_page 404 /gone.html;
        error_page 401 /gone.html;
        proxy_pass http://backend;
    }
    location /through/ {
        error_page 404 /gone.html;
        proxy_pass http://backend;
    }
}
