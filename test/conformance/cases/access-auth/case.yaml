directives: [set_real_ip_from, real_ip_header, real_ip_recursive, allow, deny, auth_basic, auth_basic_user_file, auth_request, limit_req_zone, limit_req, limit_req_status]
requests:
  - {target: /ip/a, headers: {Host: example.com, X-Forwarded-For: 10.1.0.5}}
  - {target: /ip/b, headers: {Host: example.com, X-Forwarded-For: 10.1.2.3}}
  - {target: /ip/c, headers: {Host: example.com, X-Forwarded-For: 192.0.2.1}}
  - {target: /ip/d, headers: {Host: example.com}}
  - {target: /ip/e, headers: {Host: example.com, X-Forwarded-For: "10.1.0.9, 192.0.2.1"}}
  - {target: /basic/x, headers: {Host: example.com}}
  # alice:secret, alice:wrong, bob:secret, not base64
  - {target: /basic/x, headers: {Host: example.com, Authorization: Basic YWxpY2U6c2VjcmV0}}
  - {target: /basic/x, headers: {Host: example.com, Authorization: Basic YWxpY2U6d3Jvbmc=}}
  - {target: /basic/x, headers: {Host: example.com, Authorization: Basic Ym9iOnNlY3JldA==}}
  - {target: /basic/x, headers: {Host: example.com, Authorization: Basic "!!!"}}
  - {target: "/fwd/a?q=1", headers: {Host: example.com, X-Token: t1}}
  - {target: /fwd/b, headers: {Host: example.com, X-Echo-Status: "401"}}
  - {target: /fwd/c, headers: {Host: example.com, X-Echo-Status: "403"}}
  - {target: /fwd/d, headers: {Host: example.com, X-Echo-Status: "500"}}
  - {target: /fwd/e, headers: {Host: example.com, X-Echo-Status: "404"}}
  - {target: /rl/1, headers: {Host: example.com}}
  - {target: /rl/2, headers: {Host: example.com}}
  - {target: /rl/3, headers: {Host: example.com, X-Forwarded-For: 198.51.100.7}}
  - {target: /who/, headers: {Host: example.com, X-Forwarded-For: "203.0.113.9, 127.0.0.1"}}
  - {target: /who/, headers: {Host: example.com, X-Forwarded-For: "203.0.113.9, 192.0.2.1"}}
