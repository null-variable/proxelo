limit_req_zone $binary_remote_addr zone=one:1m rate=1r/m;
upstream backend {
    server 127.0.0.1:18481;
}
server {
    listen 127.0.0.1:18480;
    server_name example.com;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    location /ip/ {
        allow 10.1.0.0/16;
        deny 10.1.2.3;
        deny all;
        proxy_pass http://backend;
    }
    location /basic/ {
        auth_basic "admin area";
        auth_basic_user_file /srv/www/.htpasswd;
        proxy_pass http://backend;
    }
    location /fwd/ {
        auth_request /_check;
        proxy_pass http://backend;
    }
    location = /_check {
        internal;
        proxy_pass http://backend/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }
    location /rl/ {
        limit_req zone=one;
        limit_req_status 429;
        proxy_pass http://backend;
    }
    location /who/ {
        return 200 "$remote_addr $realip_remote_addr\n";
    }
}
