server {
    listen 127.0.0.1:18480 default_server;
    server_name _;
    return 200 "default\n";
}
server {
    listen 127.0.0.1:18480;
    server_name example.com www.example.com;
    return 200 "exact\n";
}
server {
    listen 127.0.0.1:18480;
    server_name *.example.com;
    return 200 "leading wildcard\n";
}
server {
    listen 127.0.0.1:18480;
    server_name mail.*;
    return 200 "trailing wildcard\n";
}
server {
    listen 127.0.0.1:18480;
    server_name ~^api\d+\.example\.org$;
    return 200 "regex\n";
}
