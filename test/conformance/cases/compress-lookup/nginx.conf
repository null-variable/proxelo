upstream backend {
    server 127.0.0.1:18481;
}
map $http_x_kind $kind {
    default other;
    api is-api;
    ~^w(.*)$ w-$1;
    ~*^ADMIN admin;
}
map $kind $tier {
    default low;
    is-api high;
}
geo $remote_addr $net {
    default far;
    127.0.0.0/8 local;
    127.0.0.1 me;
}
geo $http_x_ip $xnet {
    default none;
    10.0.0.0/8 ten;
    10.1.0.0/16 ten-one;
    2001:db8::/32 doc6;
}
split_clients "$http_x_user" $bucket {
    10% a;
    50.5% b;
    * c;
}
server {
    listen 127.0.0.1:18480;
    server_name example.com;
    root /srv/www;
    gzip on;
    gzip_vary on;
    gzip_types text/plain;
    gzip_static on;
    location /lk/ {
        return 200 "kind=$kind tier=$tier net=$net xnet=$xnet bucket=$bucket\n";
    }
    location /up/ {
        proxy_pass http://backend;
    }
    location /css/ {
        gzip_types text/css;
        rewrite ^/css/(.*)$ /$1 break;
    }
}
