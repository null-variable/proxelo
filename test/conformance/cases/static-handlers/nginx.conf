server {
    listen 127.0.0.1:18480;
    server_name example.com;
    root /srv/www;
    location /list/ { autoindex on; }
    location /json/ { autoindex on; autoindex_format json; }
    location /approx/ { autoindex on; autoindex_exact_size off; }
    location /xml/ { autoindex on; autoindex_format xml; }
    location /jsonp/ { autoindex on; autoindex_format jsonp; }
    location /one/ { random_index on; }
    location /empty/ { random_index on; }
    location /media/ { flv; }
}
