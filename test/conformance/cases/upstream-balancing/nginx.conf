upstream rr {
    server 127.0.0.1:18481 weight=3;
    server 127.0.0.1:18482;
    server 127.0.0.1:18483 down;
    server 127.0.0.1:18484 backup;
}
upstream byuri {
    hash $request_uri;
    server 127.0.0.1:18481;
    server 127.0.0.1:18482 weight=2;
    server 127.0.0.1:18483;
}
upstream ring {
    hash $arg_k consistent;
    server 127.0.0.1:18481;
    server 127.0.0.1:18482;
    server 127.0.0.1:18483;
    server 127.0.0.1:18484;
}
upstream client {
    ip_hash;
    server 127.0.0.1:18481;
    server 127.0.0.1:18482;
    server 127.0.0.1:18483;
}
server {
    listen 127.0.0.1:18480;
    server_name example.com;
    location /rr/ {
        proxy_pass http://rr;
    }
    location /hash/ {
        proxy_pass http://byuri;
    }
    location /ring/ {
        proxy_pass http://ring;
    }
    location /ip/ {
        proxy_pass http://client;
    }
}
