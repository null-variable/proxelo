upstream backend {
    server 127.0.0.1:18481;
}
server {
    listen 127.0.0.1:18480;
    server_name example.com;
    location /plain/ {
        proxy_pass http://backend;
    }
    location /pass/ {
        proxy_pass_header X-Pad;
        proxy_pass_header X-Accel-Charset;
        proxy_pass http://backend;
    }
    location /method/ {
        proxy_method PUT;
        proxy_pass http://backend;
    }
    location /varmethod/ {
        proxy_method $arg_m;
        proxy_pass http://backend;
    }
    location /setbody/ {
        proxy_set_body "uri=$uri&a=$arg_a";
        proxy_pass http://backend;
    }
    location /bare/ {
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_pass http://backend;
    }
    location /noheaders/ {
        proxy_pass_request_headers off;
        proxy_pass http://backend;
    }
    location /bind/ {
        proxy_bind 127.0.0.1;
        proxy_limit_rate 1m;
        proxy_pass http://backend;
    }
}
