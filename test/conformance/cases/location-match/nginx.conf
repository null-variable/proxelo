server {
    listen 127.0.0.1:18480;
    server_name example.com;
    location = /exact { return 200 "exact\n"; }
    location / { return 200 "root prefix\n"; }
    location /docs/ { return 200 "docs prefix\n"; }
    location /docs/api/ { return 200 "longer prefix\n"; }
    location ^~ /static/ { return 200 "priority prefix\n"; }
    location ~ \.php$ { return 200 "regex\n"; }
    location ~* \.(png|jpg)$ { return 200 "regex ci\n"; }
}
