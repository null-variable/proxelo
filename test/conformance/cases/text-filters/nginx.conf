server {
    listen 127.0.0.1:18480;
    server_name example.com;
    root /srv/www;
    location /sub/ {
        sub_filter 'http://old.example' 'https://$host';
        sub_filter old new;
        sub_filter_types text/css;
    }
    location /once/ {
        sub_filter old new;
        sub_filter_once on;
        rewrite ^/once/(.*)$ /sub/$1 break;
    }
    location /all/ {
        sub_filter old new;
        sub_filter_once off;
        sub_filter_last_modified on;
        rewrite ^/all/(.*)$ /sub/$1 break;
    }
    location /uid/ {
        userid on;
        userid_name vid;
        userid_p3p 'CP="NOI"';
    }
    location /got {
        userid log;
        userid_name vid;
        return 200 "got=$uid_got set=$uid_set\n";
    }
    location /got1 {
        userid v1;
        userid_name vid;
        return 200 "got=$uid_got set=$uid_set\n";
    }
}
