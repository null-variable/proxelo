upstream backend {
    server 127.0.0.1:18481;
}
server {
    listen 127.0.0.1:18480;
    server_name example.com;
    root /srv/www;
    location /ssi/ {
        ssi on;
    }
    location /quiet/ {
        ssi on;
        ssi_silent_errors on;
        ssi_types text/plain;
        rewrite ^/quiet/(.*)$ /ssi/$1 break;
    }
    location /add/ {
        add_before_body /head.html;
        add_after_body /foot.html;
    }
    location /up/ {
        proxy_pass http://backend;
    }
    location /hidden {
        internal;
        proxy_pass http://backend;
    }
}
